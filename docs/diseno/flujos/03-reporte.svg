<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2100" width="1400" height="2100" role="img" aria-labelledby="title"><title id="title">3. Crear reporte y consultar respuesta</title><rect width="100%" height="100%" fill="white"/><text x="36" y="34" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="27" fill="black">3. Crear reporte y consultar respuesta</text><polyline points="480,145 480,240" fill="none" stroke="black" stroke-width="3"/><polygon points="480,240 487.0,225.0 473.0,225.0" fill="black"/><polyline points="480,360 480,450" fill="none" stroke="black" stroke-width="3"/><polygon points="480,450 487.0,435.0 473.0,435.0" fill="black"/><polyline points="680,520 880,520" fill="none" stroke="black" stroke-width="3"/><polygon points="880,520 865.0,513.0 865.0,527.0" fill="black"/><text x="765" y="495" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">No</text><polyline points="1060,470 1060,300 680,300" fill="none" stroke="black" stroke-width="3"/><polygon points="680,300 695.0,307.0 695.0,293.0" fill="black"/><text x="1075" y="385" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Corregir</text><polyline points="480,590 480,700" fill="none" stroke="black" stroke-width="3"/><polygon points="480,700 487.0,685.0 473.0,685.0" fill="black"/><text x="502" y="640" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Sí</text><polyline points="480,820 480,915" fill="none" stroke="black" stroke-width="3"/><polygon points="480,915 487.0,900.0 473.0,900.0" fill="black"/><polyline points="290,980 120,980 120,300 280,300" fill="none" stroke="black" stroke-width="3"/><polygon points="280,300 265.0,293.0 265.0,307.0" fill="black"/><text x="130" y="880" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">No: editar</text><polyline points="480,1045 480,1125" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1125 487.0,1110.0 473.0,1110.0" fill="black"/><text x="502" y="1090" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Sí</text><polyline points="480,1235 480,1320" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1320 487.0,1305.0 473.0,1305.0" fill="black"/><polyline points="690,1390 880,1390" fill="none" stroke="black" stroke-width="3"/><polygon points="880,1390 865.0,1383.0 865.0,1397.0" fill="black"/><text x="705" y="1365" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">No / incierto</text><polyline points="1060,1335 1060,1180 680,1180" fill="none" stroke="black" stroke-width="3"/><polygon points="680,1180 695.0,1187.0 695.0,1173.0" fill="black"/><text x="1075" y="1260" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Reintentar</text><polyline points="480,1460 480,1545" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1545 487.0,1530.0 473.0,1530.0" fill="black"/><text x="502" y="1500" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Sí</text><polyline points="480,1655 480,1735" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1735 487.0,1720.0 473.0,1720.0" fill="black"/><polyline points="480,1845 480,1930" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1930 487.0,1915.0 473.0,1915.0" fill="black"/><rect x="290.0" y="75.0" width="380" height="70" rx="35.0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="110.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Desde Inicio: Pedir apoyo</text><rect x="280.0" y="240.0" width="400" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="270.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E04 · Contar lo ocurrido</text><text x="480" y="300.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Me pasó / Lo presencié + relato</text><text x="480" y="330.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Lugar y momento: opcionales</text><polygon points="480,450.0 680.0,520 480,590.0 280.0,520" fill="white" stroke="black" stroke-width="3"/><text x="480" y="505.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Completó las opciones</text><text x="480" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">y el relato?</text><rect x="880.0" y="470.0" width="360" height="100" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1060" y="505.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Señalar lo que falta</text><text x="1060" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Sin borrar el texto escrito</text><rect x="280.0" y="700.0" width="400" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="730.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E05 · Revisar reporte</text><text x="480" y="760.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Resumen + destinatario + horario</text><text x="480" y="790.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Botones: Editar / Enviar reporte</text><polygon points="480,915.0 670.0,980 480,1045.0 290.0,980" fill="white" stroke="black" stroke-width="3"/><text x="480" y="980.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Confirma enviar?</text><rect x="280.0" y="1125.0" width="400" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1150.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Enviar reporte</text><text x="480" y="1180.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Mostrar: Enviando…</text><text x="480" y="1210.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Evitar pulsaciones repetidas</text><polygon points="480,1320.0 690.0,1390 480,1460.0 270.0,1390" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1390.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Recepción confirmada?</text><rect x="880.0" y="1335.0" width="360" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1060" y="1360.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Mostrar pendiente / error</text><text x="1060" y="1390.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Conservar texto en pantalla</text><text x="1060" y="1420.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Comprobar y reintentar</text><rect x="280.0" y="1545.0" width="400" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1570.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E06 · Reporte recibido</text><text x="480" y="1600.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Referencia + siguiente paso</text><text x="480" y="1630.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Botón: Ver seguimiento</text><rect x="270.0" y="1735.0" width="420" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1760.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E08 · Estado y conversación</text><text x="480" y="1790.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Con respuesta: leer y contestar</text><text x="480" y="1820.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Sin respuesta: explicar la espera</text><rect x="270.0" y="1930.0" width="420" height="80" rx="40.0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1955.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Fin del recorrido</text><text x="480" y="1985.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Volver a Mis reportes o Inicio</text></svg>