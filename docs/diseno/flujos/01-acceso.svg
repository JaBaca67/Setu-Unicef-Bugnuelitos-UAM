baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">No es un formulario adicional</text><rect x="310.0" y="1615.0" width="340" height="90" rx="45.0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1645.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E03 · Inicio / Home</text><text x="480" y="1675.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Continuar al diagrama 2</text><rect x="835.0" y="390.0" width="350" height="100" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1010" y="425.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E09 · Ayuda sin iniciar sesión</text><text x="1010" y="455.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Volver a la pantalla anterior</text></svg>