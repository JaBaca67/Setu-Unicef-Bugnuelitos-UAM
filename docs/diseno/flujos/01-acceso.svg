 text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Sesión estudiantil</text><text x="480" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">válida?</text><rect x="310.0" y="384.0" width="340" height="112" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="410.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E01 · Bienvenida</text><text x="480" y="440.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Qué hace la app y privacidad</text><text x="480" y="470.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Botón: Entrar a mi centro</text><rect x="310.0" y="584.0" width="340" height="112" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="610.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E02 · Primer ingreso / registro</text><text x="480" y="640.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Campo: invitación del centro</text><text x="480" y="670.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Botón: Comprobar invitación</text><polygon points="480,770.0 665.0,840 480,910.0 295.0,840" fill="white" stroke="black" stroke-width="3"/><text x="480" y="825.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Invitación válida y</text><text x="480" y="855.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">centro disponible?</text><rect x="835.0" y="784.0" width="350" height="112" rx="0" fill="white" stroke="black" stroke-width="3"/><text x=