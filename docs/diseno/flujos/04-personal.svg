<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1810" width="1400" height="1810" role="img" aria-labelledby="title"><title id="title">4. Login y atención del personal</title><rect width="100%" height="100%" fill="white"/><text x="36" y="34" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="27" fill="black">4. Login y atención del personal</text><polyline points="480,145 480,240" fill="none" stroke="black" stroke-width="3"/><polygon points="480,240 487.0,225.0 473.0,225.0" fill="black"/><polyline points="480,360 480,455" fill="none" stroke="black" stroke-width="3"/><polygon points="480,455 487.0,440.0 473.0,440.0" fill="black"/><polyline points="690,530 890,530" fill="none" stroke="black" stroke-width="3"/><polygon points="890,530 875.0,523.0 875.0,537.0" fill="black"/><text x="775" y="505" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">No</text><polyline points="1090,475 1090,300 690,300" fill="none" stroke="black" stroke-width="3"/><polygon points="690,300 705.0,307.0 705.0,293.0" fill="black"/><text x="1100" y="410" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Reintentar</text><polyline points="480,605 480,710" fill="none" stroke="black" stroke-width="3"/><polygon points="480,710 487.0,695.0 473.0,695.0" fill="black"/><text x="502" y="655" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Sí</text><polyline points="480,830 480,920" fill="none" stroke="black" stroke-width="3"/><polygon points="480,920 487.0,905.0 473.0,905.0" fill="black"/><polyline points="690,990 890,990" fill="none" stroke="black" stroke-width="3"/><polygon points="890,990 875.0,983.0 875.0,997.0" fill="black"/><text x="775" y="965" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">No</text><polyline points="1090,935 1090,770 690,770" fill="none" stroke="black" stroke-width="3"/><polygon points="690,770 705.0,777.0 705.0,763.0" fill="black"/><text x="1100" y="860" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Volver</text><polyline points="480,1060 480,1160" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1160 487.0,1145.0 473.0,1145.0" fill="black"/><text x="502" y="1110" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Sí</text><polyline points="480,1280 480,1370" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1370 487.0,1355.0 473.0,1355.0" fill="black"/><polyline points="690,1430 890,1430" fill="none" stroke="black" stroke-width="3"/><polygon points="890,1430 875.0,1423.0 875.0,1437.0" fill="black"/><text x="705" y="1405" text-anchor="start" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="black">Si responde</text><polyline points="480,1490 480,1615" fill="none" stroke="black" stroke-width="3"/><polygon points="480,1615 487.0,1600.0 473.0,1600.0" fill="black"/><rect x="290.0" y="75.0" width="380" height="70" rx="35.0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="110.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E01: Acceso del personal</text><rect x="270.0" y="240.0" width="420" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="270.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">R01 · Iniciar sesión</text><text x="480" y="300.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Correo institucional + contraseña</text><text x="480" y="330.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Botón: Iniciar sesión</text><polygon points="480,455.0 690.0,530 480,605.0 270.0,530" fill="white" stroke="black" stroke-width="3"/><text x="480" y="515.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Acceso validado y</text><text x="480" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">cuenta autorizada?</text><rect x="890.0" y="475.0" width="400" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1090" y="515.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Mostrar error de acceso</text><text x="1090" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Corregir / pedir ayuda al centro</text><rect x="270.0" y="710.0" width="420" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="740.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">R02 · Bandeja autorizada</text><text x="480" y="770.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Centro + filtros por estado</text><text x="480" y="800.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Referencia, fecha y mensaje nuevo</text><polygon points="480,920.0 690.0,990 480,1060.0 270.0,990" fill="white" stroke="black" stroke-width="3"/><text x="480" y="990.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">¿Hay un caso que abrir?</text><rect x="890.0" y="935.0" width="400" height="110" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1090" y="975.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Mostrar bandeja vacía</text><text x="1090" y="1005.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Volver o consultar más tarde</text><rect x="270.0" y="1160.0" width="420" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1190.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">R03 · Atender caso</text><text x="480" y="1220.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Leer relato y conversación</text><text x="480" y="1250.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Responder / registrar atención</text><rect x="270.0" y="1370.0" width="420" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1400.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Enviar respuesta visible</text><text x="480" y="1430.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Actualizar estado con permiso</text><text x="480" y="1460.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Notas internas: sección separada</text><rect x="890.0" y="1370.0" width="400" height="120" rx="0" fill="white" stroke="black" stroke-width="3"/><text x="1090" y="1400.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">E08 · El estudiante consulta</text><text x="1090" y="1430.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Solo la respuesta visible</text><text x="1090" y="1460.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Nunca las notas internas</text><rect x="270.0" y="1615.0" width="420" height="90" rx="45.0" fill="white" stroke="black" stroke-width="3"/><text x="480" y="1645.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Fin de la atención actual</text><text x="480" y="1675.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="black">Volver a bandeja R02</text></svg>